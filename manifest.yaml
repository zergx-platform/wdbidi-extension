# wdbidi-extension protocol manifest — single declarative source for the
# extension's wire protocol (tools). Handlers are bound by name in code
# (tools.go). Go rewrite of webdriver-extension: drives a Selenium standalone
# node over WebDriver BiDi.

id: browser
version: 0.1.0

tools:
  - name: navigate
    description: Navigate the browser to a URL.
    descriptions:
      zh: "让浏览器导航到某个 URL。"
    input_schema:
      type: object
      properties:
        url: { type: string }
      required: [url]
  - name: navigate_back
    description: Go back in the browser's history.
    descriptions:
      zh: "在浏览器历史中后退。"
    input_schema:
      type: object
      properties: {}
  - name: navigate_forward
    description: Go forward in the browser's history.
    descriptions:
      zh: "在浏览器历史中前进。"
    input_schema:
      type: object
      properties: {}
  - name: close
    description: Close the current browser page (and reset the session's browsing context).
    descriptions:
      zh: "关闭当前浏览器页面（并重置会话的浏览上下文）。"
    input_schema:
      type: object
      properties: {}
  - name: resize
    description: Resize the browser viewport.
    descriptions:
      zh: "调整浏览器视口大小。"
    input_schema:
      type: object
      properties:
        width: { type: integer }
        height: { type: integer }
  - name: snapshot
    description: Capture an accessibility snapshot of the current page (mode ai, with refs and boxes).
    descriptions:
      zh: "捕获当前页面的无障碍快照（模式 ai，含 ref 与 boxes）。"
    input_schema:
      type: object
      properties:
        depth: { type: integer }
        boxes: { type: boolean }
  - name: screenshot
    description: Take a screenshot of the current page (or an element by ref). PNG only.
    descriptions:
      zh: "对当前页面截图（可选按元素或整页）。"
    input_schema:
      type: object
      properties:
        element: { type: string }
        fullPage: { type: boolean }
  - name: click
    description: Click an element (by aria ref or CSS selector).
    descriptions:
      zh: "点击某个元素（按 aria ref 或 CSS 选择器）。"
    input_schema:
      type: object
      properties:
        element: { type: string }
        button: { type: string, enum: [left, right, middle] }
        doubleClick: { type: boolean }
      required: [element]
  - name: hover
    description: Hover over an element (by aria ref or CSS selector).
    descriptions:
      zh: "悬停在某个元素上（按 aria ref 或 CSS 选择器）。"
    input_schema:
      type: object
      properties:
        element: { type: string }
      required: [element]
  - name: type
    description: Type text into an editable element.
    descriptions:
      zh: "向可编辑元素输入文本。"
    input_schema:
      type: object
      properties:
        element: { type: string }
        text: { type: string }
        slowly: { type: boolean }
        submit: { type: boolean }
      required: [element, text]
  - name: select_option
    description: Select options in a dropdown.
    descriptions:
      zh: "在下拉框中选择选项。"
    input_schema:
      type: object
      properties:
        element: { type: string }
        values: { type: array, items: { type: string } }
      required: [element, values]
  - name: fill_form
    description: Fill multiple form fields in one call.
    descriptions:
      zh: "一次调用填写多个表单字段。"
    input_schema:
      type: object
      properties:
        fields:
          type: array
          items:
            type: object
            properties:
              target: { type: string }
              value: { type: string }
            required: [target, value]
      required: [fields]
  - name: press_key
    description: Press a keyboard key.
    descriptions:
      zh: "按下某个键盘按键。"
    input_schema:
      type: object
      properties:
        key: { type: string }
      required: [key]
  - name: drag
    description: Drag from one element to another.
    descriptions:
      zh: "从某个元素拖到另一个元素。"
    input_schema:
      type: object
      properties:
        startElement: { type: string }
        endElement: { type: string }
      required: [startElement, endElement]
  - name: drop
    description: Drop files or MIME-typed data onto an element, as if dragged from outside the page. At least one of paths or data must be provided.
    descriptions:
      zh: "把文件或 MIME 类型的数据拖放到某元素上（如同从页面外部拖入）。paths 与 data 至少提供一个。"
    input_schema:
      type: object
      properties:
        element: { type: string }
        paths: { type: array, items: { type: string } }
        data: { type: object, additionalProperties: { type: string } }
      required: [element]
  - name: file_upload
    description: Upload files to a file input (by aria ref or CSS selector).
    descriptions:
      zh: "向文件输入上载文件（按 aria ref 或 CSS 选择器）。"
    input_schema:
      type: object
      properties:
        element: { type: string }
        paths: { type: array, items: { type: string } }
      required: [element, paths]
  - name: find
    description: Search the current page snapshot for text or a regex.
    descriptions:
      zh: "在当前页面快照中搜索文本或正则。"
    input_schema:
      type: object
      properties:
        text: { type: string }
        regex: { type: string }
  - name: wait_for
    description: Wait for time (seconds), text, or a regex.
    descriptions:
      zh: "等待时间（秒）、文本或正则。"
    input_schema:
      type: object
      properties:
        time: { type: number }
        text: { type: string }
        regex: { type: string }
  - name: expect_text
    description: Verify that text is visible on the page right now. Fails (with an error) if the text is not found, like an assertion.
    descriptions:
      zh: "验证文本当前在页面上可见。若找不到则失败（报错），如同断言。"
    input_schema:
      type: object
      properties:
        text: { type: string }
      required: [text]
  - name: handle_dialog
    description: Accept or dismiss the next browser dialog (alert/confirm/prompt).
    descriptions:
      zh: "接受或关闭下一个浏览器对话框（alert/confirm/prompt）。"
    input_schema:
      type: object
      properties:
        accept: { type: boolean }
        promptText: { type: string }
  - name: evaluate
    description: Evaluate a JavaScript expression in the page and return the JSON result.
    descriptions:
      zh: "在页面中执行 JavaScript 表达式并返回 JSON 结果。"
    input_schema:
      type: object
      properties:
        code: { type: string }
      required: [code]
  - name: tabs
    description: List, create, close, or select browser tabs (tabs in the session context).
    descriptions:
      zh: "列出、创建、关闭或选择浏览器标签页（会话上下文中的标签）。"
    input_schema:
      type: object
      properties:
        action: { type: string, enum: [list, new, close, select] }
        index: { type: integer }
        url: { type: string }
  - name: network_requests
    description: List network requests made by the current page.
    descriptions:
      zh: "列出当前页面发起的网络请求。"
    input_schema:
      type: object
      properties: {}
  - name: webfetch
    description: Fetch content from an HTTP(S) URL and return it as text, markdown, or html. Defaults to markdown.
    descriptions:
      zh: "从 HTTP(S) URL 获取内容，以文本、markdown 或 html 返回；默认 markdown。"
    input_schema:
      type: object
      properties:
        url: { type: string }
        format: { type: string, enum: [text, markdown, html] }
        timeout: { type: integer }
      required: [url]
  - name: reload
    description: Reload the current page.
    descriptions:
      zh: "重新加载当前页面。"
    input_schema:
      type: object
      properties: {}
  - name: print_pdf
    description: Print the current page as a PDF (returns base64).
    descriptions:
      zh: "将当前页面打印为 PDF（返回 base64）。"
    input_schema:
      type: object
      properties: {}
  - name: cookies_get
    description: Get cookies for the current page.
    descriptions:
      zh: "获取当前页面的 cookie。"
    input_schema:
      type: object
      properties:
        url: { type: string }
  - name: cookies_set
    description: Set a cookie for the current page.
    descriptions:
      zh: "为当前页面设置 cookie。"
    input_schema:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        domain: { type: string }
        path: { type: string }
      required: [name, value, domain]
  - name: cookies_delete
    description: Delete cookies (by name, or all) for the current page.
    descriptions:
      zh: "删除 cookie（按名称，或全部）for 当前页面。"
    input_schema:
      type: object
      properties:
        name: { type: string }
  - name: route
    description: Intercept network requests matching a URL pattern. mode=abort blocks, mode=provide responds with status+body+contentType, mode=continue forwards. Returns a route id.
    descriptions:
      zh: "拦截与 URL 模式匹配的网络请求。mode=abort 阻断，mode=provide 以 status+body+contentType 响应，mode=continue 放行。返回 route id。"
    input_schema:
      type: object
      properties:
        url: { type: string }
        mode: { type: string, enum: [abort, provide, continue] }
        status: { type: integer }
        body: { type: string }
        contentType: { type: string }
      required: [url, mode]
  - name: unroute
    description: Remove a network intercept by route id.
    descriptions:
      zh: "按 route id 移除网络拦截。"
    input_schema:
      type: object
      properties:
        routeId: { type: string }
      required: [routeId]
  - name: console_logs
    description: Return captured browser console log entries for this session.
    descriptions:
      zh: "返回本会话捕获的浏览器控制台日志项。"
    input_schema:
      type: object
      properties: {}
  - name: emulate
    description: Override browser emulation settings (userAgent, timezone, geolocation).
    descriptions:
      zh: "覆盖浏览器仿真设置（userAgent、时区、地理位置）。"
    input_schema:
      type: object
      properties:
        userAgent: { type: string }
        timezone: { type: string }
        latitude: { type: number }
        longitude: { type: number }
  - name: add_init_script
    description: Add a script that runs on every subsequent navigation (before page scripts).
    descriptions:
      zh: "添加一个在后续每次导航时（页面脚本之前）运行的脚本。"
    input_schema:
      type: object
      properties:
        script: { type: string }
      required: [script]
